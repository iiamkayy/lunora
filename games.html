<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Games</title>
  <link rel="stylesheet" href="shared.css" />
  <style>
    html,body{height:100%;overflow:hidden}
    .app{display:flex;flex-direction:column;height:100vh;background:#0a0d0e}
    .hubbar{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.02);flex:0 0 auto;overflow-x:auto;scrollbar-width:none}
    .hubbar::-webkit-scrollbar{display:none}
    .src{display:flex;align-items:center;gap:8px;height:36px;padding:0 16px;border-radius:11px;border:1px solid var(--line);background:transparent;color:var(--muted);font-weight:800;font-size:12.5px;cursor:pointer;transition:.15s;white-space:nowrap}
    .src:hover{color:var(--text);border-color:var(--line2)}
    .src.on{background:var(--acc);border-color:transparent;color:#06130d}
    .src .cnt{font-size:9.5px;font-weight:900;opacity:.75}
    .hubbar .right{margin-left:auto;display:flex;gap:8px;align-items:center}
    .hint{color:var(--dim);font-size:11px;font-weight:700;white-space:nowrap}
    .srcwrap{flex:1;position:relative;background:#080b0c;min-height:0}
    .srcwrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#080b0c}
    .pane{position:absolute;inset:0;display:none;overflow-y:auto}
    .pane.on{display:block}

    /* lumin */
    #pane-lumin{padding:20px}
    #lumin-box{min-height:600px}

    /* extras */
    .extras{padding:clamp(16px,3vw,34px);max-width:1200px;margin:0 auto}
    .extras h2{margin:0 0 4px;font-size:20px;font-weight:900}
    .extras .sub{color:var(--muted);font-size:12px;margin-bottom:22px}
    .egrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
    .egame{
      border:1px solid var(--line);background:var(--glass);border-radius:13px;overflow:hidden;cursor:pointer;
      transition:.16s cubic-bezier(.2,.8,.3,1);position:relative;
    }
    .egame:hover{transform:translateY(-3px);border-color:var(--line2);box-shadow:0 14px 34px rgba(0,0,0,.35)}
    .egame .cover{aspect-ratio:16/10;display:grid;place-items:center;font-weight:950;font-size:40px;color:rgba(255,255,255,.16);letter-spacing:-.05em;position:relative}
    .egame .cover:after{content:"PLAY";position:absolute;right:9px;bottom:9px;background:rgba(0,0,0,.7);border:1px solid rgba(255,255,255,.15);color:#eee;padding:4px 8px;border-radius:7px;font:800 9px/1 ui-monospace,monospace;letter-spacing:.09em;opacity:0;transition:.15s}
    .egame:hover .cover:after{opacity:1}
    .egame .meta{padding:11px 12px 12px}
    .egame .meta b{display:block;font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .egame .meta span{font-size:10px;color:var(--dim);font-weight:700;text-transform:uppercase;letter-spacing:.07em}

    /* player overlay */
    .player{position:fixed;inset:0;z-index:100;background:#050607;display:none;flex-direction:column}
    .player.open{display:flex}
    .pbar{height:52px;flex:0 0 52px;display:flex;align-items:center;gap:10px;padding:0 12px 0 16px;background:#0a0d0e;border-bottom:1px solid var(--line)}
    .pbar b{flex:1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .pload{position:absolute;inset:52px 0 0;display:grid;place-items:center;background:#050607;transition:opacity .25s}
    .pload.gone{opacity:0;pointer-events:none}
    .player iframe{flex:1;border:0;background:#000}
  </style>
</head>
<body>
  <div class="app">
    <div class="hubbar">
      <button class="src on" data-src="library">🎮 lunora library</button>
      <button class="src" data-src="figure">☁ figure</button>
      <button class="src" data-src="lumin">✦ lumin</button>
      <button class="src" data-src="extras">🕹 classics</button>
      <div class="right">
        <span class="hint" id="lib-hint">thousands of games, zero downloads</span>
      </div>
    </div>

    <div class="srcwrap">
      <iframe id="frame-library" src="games/index.html" allow="autoplay; fullscreen; gamepad; clipboard-read; clipboard-write; pointer-lock" allowfullscreen></iframe>
      <iframe id="frame-figure" src="games/Figure.html" hidden allow="autoplay; fullscreen; gamepad; clipboard-read; clipboard-write; pointer-lock" allowfullscreen></iframe>

      <div class="pane" id="pane-lumin">
        <div id="lumin-box"></div>
      </div>

      <div class="pane" id="pane-extras">
        <div class="extras">
          <h2>Classics</h2>
          <div class="sub">hand-picked html5 legends that run anywhere — instant play, no proxy needed.</div>
          <div class="egrid" id="egrid"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- player -->
  <div class="player" id="player">
    <div class="pbar">
      <b id="p-title">game</b>
      <button class="vbtn sm" id="p-reload">reload</button>
      <button class="vbtn sm" id="p-full">fullscreen</button>
      <button class="vbtn sm" id="p-browser">open in browser</button>
      <button class="vbtn sm danger" id="p-close">close</button>
    </div>
    <iframe id="p-frame" allow="autoplay; fullscreen; gamepad; clipboard-read; clipboard-write; pointer-lock" allowfullscreen></iframe>
    <div class="pload" id="p-load"><div style="text-align:center"><div class="spinner" style="margin:0 auto 12px"></div><div class="dimtxt">loading game…</div></div></div>
  </div>

  <script src="shared.js"></script>
  <script>
    (() => {
      'use strict';
      const $ = (s) => document.querySelector(s);
      const V = window.Velora;
      const { esc, toast } = V;

      /* ---------- source tabs ---------- */
      const frames = { library: $('#frame-library'), figure: $('#frame-figure') };
      document.querySelectorAll('.src').forEach((b) => {
        b.addEventListener('click', () => {
          document.querySelectorAll('.src').forEach((x) => x.classList.toggle('on', x === b));
          const src = b.dataset.src;
          for (const [k, f] of Object.entries(frames)) f.hidden = k !== src;
          $('#pane-lumin').classList.toggle('on', src === 'lumin');
          $('#pane-extras').classList.toggle('on', src === 'extras');
          if (src === 'lumin' && !window.Lumin) initLumin();
        });
      });

      /* ---------- lumin sdk ---------- */
      let luminStarted = false;
      function initLumin() {
        if (luminStarted) return;
        luminStarted = true;
        const s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/gh/luminsdk/script@latest/lumin.min.js';
        s.onload = () => {
          try {
            Lumin.init({ container: '#lumin-box', theme: 'dark' });
          } catch (e) {
            $('#lumin-box').innerHTML = '<div class="dimtxt" style="padding:40px;text-align:center">lumin failed to load — it may be blocked on your network.</div>';
          }
        };
        s.onerror = () => {
          $('#lumin-box').innerHTML = '<div class="dimtxt" style="padding:40px;text-align:center">couldn\'t reach luminsdk.com — it may be blocked on your network.</div>';
        };
        document.head.appendChild(s);
      }

      /* ---------- classics ---------- */
      const GAMES = [
        { name: '2048',          url: 'https://gabrielecirulli.github.io/2048/',        color: '#edc22e' },
        { name: 'Hextris',       url: 'https://hextris.github.io/hextris/',             color: '#f2405a' },
        { name: 'HexGL',         url: 'https://hexgl.bkcore.com/play/',                 color: '#00c3ff' },
        { name: 'Clumsy Bird',   url: 'https://ellisonleao.github.io/clumsy-bird/',     color: '#e8c547' },
        { name: 'Floppy Bird',   url: 'https://nebez.github.io/floppybird/',            color: '#59cd90' },
        { name: 'Astray',        url: 'https://wwwtyro.github.io/Astray/',              color: '#845ec2' },
        { name: 'DuckHunt JS',   url: 'https://mattsurabian.com/duckhunt/',             color: '#4d9b5f' },
        { name: 'Chrome Dino',   url: 'https://chromedino.com/',                        color: '#9aa0a6' },
        { name: 'Missile Game',  url: 'https://missile-game.bwhmather.com/',            color: '#ff6b6b' },
        { name: 'Emberwind',     url: 'https://operasoftware.github.io/Emberwind/',     color: '#c06c3e' },
      ];

      const egrid = $('#egrid');
      for (const g of GAMES) {
        const d = document.createElement('div');
        d.className = 'egame';
        const initials = g.name.replace(/[^a-z0-9 ]/gi, '').split(/\s+/).slice(0, 2).map((x) => x[0]).join('').toUpperCase();
        d.innerHTML = `
          <div class="cover" style="background:radial-gradient(80% 90% at 30% 25%, ${esc(g.color)}33, transparent 70%), #101416">${esc(initials)}</div>
          <div class="meta"><b>${esc(g.name)}</b><span>instant play</span></div>
        `;
        d.addEventListener('click', () => play(g));
        egrid.appendChild(d);
      }

      /* ---------- player ---------- */
      const player = $('#player'), pframe = $('#p-frame'), pload = $('#p-load'), ptitle = $('#p-title');
      let current = null;
      function play(g) {
        current = g;
        ptitle.textContent = g.name;
        pload.classList.remove('gone');
        player.classList.add('open');
        pframe.src = g.url;
      }
      pframe.addEventListener('load', () => { if (current) pload.classList.add('gone'); });
      $('#p-close').addEventListener('click', () => {
        player.classList.remove('open');
        pframe.src = 'about:blank';
        current = null;
      });
      $('#p-reload').addEventListener('click', () => { if (current) { pload.classList.remove('gone'); pframe.src = current.url; } });
      $('#p-full').addEventListener('click', async () => {
        try {
          if (document.fullscreenElement) await document.exitFullscreen();
          else await player.requestFullscreen();
        } catch {}
      });
      $('#p-browser').addEventListener('click', () => {
        if (current) V.openApp('browser', { url: current.url });
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && player.classList.contains('open')) $('#p-close').click();
      });
    })();
  </script>
</body>
</html>
